<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="description" content="You're cordially invited to Bao & Sul's Wedding on 17th April 2027">
  <title>Bao & Sul | Wedding Invitation</title>
  <link rel="icon" href="./assets/monogram.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <script>
    // Enhancement only: the complete invitation is visible without JavaScript.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro-active');
      window.invitationFallback = setTimeout(function () {
        document.documentElement.classList.remove('intro-active', 'opening');
        var main = document.getElementById('invitation');
        if (main) { main.inert = false; main.removeAttribute('aria-hidden'); }
        var intro = document.getElementById('intro');
        if (intro && intro.contains(document.activeElement)) main.focus({preventScroll: true});
      }, 10000);
    }
  </script>
  <script src="./script.js" defer></script>
</head>
<body>
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-label="Opening Bao and Sul's wedding invitation">
    <button id="skip" class="skip" type="button">Skip animation <span aria-hidden="true">↗</span></button>
    <div class="envelope-scene" aria-hidden="true">
      <div class="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-card"><span class="mini-heading">THE WEDDING OF</span><span class="card-names">Bao <i>&</i> Sul</span><span class="card-date">17 APRIL 2027</span></div>
        <div class="envelope-pocket"></div>
        <div class="envelope-flap"></div>
        <div class="seal">B<span>&</span>S</div>
        <div class="envelope-names">Bao & Sul</div>
      </div>
    </div>
  </div>

  <main id="invitation" class="stationery" tabindex="-1">
    <div class="paper-border" aria-hidden="true"></div>
    <div class="falling-petals" aria-hidden="true">
      <span class="petal-path" style="--x:2%;--size:10px;--fall:19s;--delay:-5s;--drift:9px;--sway:4s"><i></i></span>
      <span class="petal-path" style="--x:5%;--size:15px;--fall:23s;--delay:-16s;--drift:-5px;--sway:5s"><i></i></span>
      <span class="petal-path" style="--x:9%;--size:9px;--fall:16s;--delay:-10s;--drift:8px;--sway:3.8s"><i></i></span>
      <span class="petal-path" style="--x:13%;--size:12px;--fall:21s;--delay:-2s;--drift:-8px;--sway:4.6s"><i></i></span>
      <span class="petal-path" style="--x:17%;--size:8px;--fall:18s;--delay:-14s;--drift:5px;--sway:4.2s"><i></i></span>
      <span class="petal-path" style="--x:21%;--size:13px;--fall:22s;--delay:-8s;--drift:-7px;--sway:5.2s"><i></i></span>
      <span class="petal-path" style="--x:78%;--size:11px;--fall:20s;--delay:-12s;--drift:6px;--sway:4.5s"><i></i></span>
      <span class="petal-path" style="--x:82%;--size:8px;--fall:17s;--delay:-4s;--drift:-9px;--sway:3.9s"><i></i></span>
      <span class="petal-path" style="--x:86%;--size:14px;--fall:24s;--delay:-19s;--drift:4px;--sway:5.3s"><i></i></span>
      <span class="petal-path" style="--x:90%;--size:10px;--fall:19.5s;--delay:-9s;--drift:-6px;--sway:4.3s"><i></i></span>
      <span class="petal-path" style="--x:94%;--size:12px;--fall:22.5s;--delay:-1s;--drift:5px;--sway:4.8s"><i></i></span>
      <span class="petal-path" style="--x:97%;--size:9px;--fall:18.5s;--delay:-13s;--drift:-7px;--sway:4.1s"><i></i></span>
    </div>
    <img class="floral floral-left" src="./assets/floral.svg" alt="" width="270" height="780">
    <img class="floral floral-right" src="./assets/floral.svg" alt="" width="270" height="780">
    <header class="invitation-heading reveal">
      <div class="ornament" aria-hidden="true"><span></span>✧<span></span></div>
      <p class="eyebrow">THE WEDDING OF</p>
      <h1>Bao <span class="ampersand">&</span> Sul</h1>
      <p class="wedding-date"><span>17</span><span>APRIL</span><span>2027</span></p>
    </header>

    <div class="photo-collage reveal" aria-label="Photographs of Bao and Sul">
      <figure class="photo photo-most-left"><img src="./assets/most-left-640.webp" srcset="./assets/most-left-640.webp 640w, ./assets/most-left-1280.webp 1280w" sizes="(max-width: 600px) 43vw, 180px" width="1280" height="853" alt="Bao and Sul striking a playful pose, with Bao wearing sunglasses."></figure>
      <figure class="photo photo-second-left"><img src="./assets/second-from-left-640.webp" srcset="./assets/second-from-left-640.webp 640w, ./assets/second-from-left-1280.webp 1280w" sizes="(max-width: 600px) 36vw, 180px" width="1280" height="853" alt="Bao and Sul smiling together while holding little character toys."></figure>
      <figure class="photo photo-centre"><img src="./assets/center-1280.webp" srcset="./assets/center-640.webp 640w, ./assets/center-1280.webp 1280w" sizes="(max-width: 600px) 82vw, 300px" width="1280" height="853" alt="Bao and Sul sharing a playful moment, with Sul making a peace sign." fetchpriority="high"></figure>
      <figure class="photo photo-second-right"><img src="./assets/second-from-right-640.webp" srcset="./assets/second-from-right-640.webp 640w, ./assets/second-from-right-1280.webp 1280w" sizes="(max-width: 600px) 36vw, 180px" width="1280" height="853" alt="Bao and Sul leaning together with cheerful, playful expressions."></figure>
      <figure class="photo photo-most-right"><img src="./assets/most-right-640.webp" srcset="./assets/most-right-640.webp 640w, ./assets/most-right-1280.webp 1280w" sizes="(max-width: 600px) 43vw, 180px" width="1280" height="853" alt="Bao holding his hand above Sul's head as they pose together."></figure>
    </div>

    <section class="invitation-message reveal" aria-label="Your invitation">
      <div class="small-ornament" aria-hidden="true">✧</div>
      <p class="message">
        <span class="message-line message-intro">You're cordially invited to</span>
        <span class="message-line message-names">Bao & Sul's Wedding</span>
        <span class="message-line message-date">on 17th April 2027</span>
      </p>
      <a class="rsvp-link" href="https://docs.google.com/forms/d/e/1FAIpQLSdyNJ41q6z1uOLgclUNu17-cXtvdMMqA6ggc3y7JIrBnq-Zaw/viewform" target="_blank" rel="noopener noreferrer">Click here to RSVP</a>
      <div class="qr-block">
        <a class="qr-link" href="https://docs.google.com/forms/d/e/1FAIpQLSdyNJ41q6z1uOLgclUNu17-cXtvdMMqA6ggc3y7JIrBnq-Zaw/viewform" target="_blank" rel="noopener noreferrer" aria-label="Open the RSVP Google Form in a new tab"><img src="./assets/rsvp-qr.png" alt="QR code for the wedding RSVP Google Form." width="1600" height="1600"></a>
        <p class="qr-caption">Scan or tap to RSVP</p>
      </div>
      <details class="calendar-save">
        <summary>Click here to save to calendar</summary>
        <div class="calendar-options">
          <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Bao%20%26%20Sul%27s%20Wedding&amp;dates=20270417%2F20270418&amp;ctz=Asia%2FSingapore&amp;details=You%27re%20cordially%20invited%20to%0ABao%20%26%20Sul%27s%20Wedding%0Aon%2017th%20April%202027%0A%0Ahttps%3A%2F%2Fsulbao4eva.github.io%2Fbao-sul-wedding%2F" target="_blank" rel="noopener noreferrer">Google Calendar <span aria-hidden="true">↗</span></a>
          <a href="./assets/bao-sul-wedding.ics" download="bao-sul-wedding.ics">Apple, Outlook & other calendars <span aria-hidden="true">↓</span></a>
        </div>
      </details>
    </section>
    <footer class="signature reveal" aria-label="With love, Bao and Sul">
      <span aria-hidden="true">B <i>&</i> S</span>
      <label class="petal-control"><input id="petals-paused" type="checkbox"> Pause petals</label>
    </footer>
  </main>
</body>
</html>
